root_environment_variable: ALLOY_PRIVATE_ROOT
default_root: repository root
data_subdirectory: data
data_license: CC-BY-4.0
primary_files:
  processed:
    filename: 01_processed_data.csv
    expected_rows: 284
    required_columns: [sample_id, alloy_or_coating_name, yield_strength_mpa, ultimate_tensile_strength_mpa, elongation_pct]
  engineered:
    filename: 02_engineered_features.csv
    expected_rows: 284
    required_columns: [sample_id]
  author_confirmed_trials:
    filename: verification_holdout.csv
    expected_rows: 4
    required_columns: [sample_id, alloy_or_coating_name, yield_strength_mpa, ultimate_tensile_strength_mpa, elongation_pct]
  historical_model_search:
    filename: results.json
  historical_predictions:
    filename: verification_predictions.csv
    expected_rows: 12
reference_outputs:
  scientific: reference/scientific
  paper: reference/paper
  descriptors: reference/descriptors
notes:
  - Read split_provenance.json and PROVENANCE.md before interpreting experimental validation.
  - Processed data and numerical reference outputs are included; raw instrument and fabrication records are not deposited.
  - Historical symbolic-regression exploration is not part of the current quick replay.
